<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vadatu Sanskrit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: one narrow column, like a phone app; chapters stack, lessons are rows. */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --ink: #1d2140; --muted: #5b6180; --line: #dde1ec;
  --accent: #b85600; --accent-ink: #ffffff; --accent-soft: #fbeedd;
  --ok: #1d7a45; --ok-bg: #e2f3e9; --bad: #ad2f27; --bad-bg: #fbe5e2;
  --sa: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
  --body: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12142a; --surface: #1b1e3a; --ink: #eceefb; --muted: #a3a8c8; --line: #2e3258;
  --accent: #f29a45; --accent-ink: #1b1206; --accent-soft: #3a2a1a;
  --ok: #6fd69c; --ok-bg: #173a29; --bad: #ff958b; --bad-bg: #3f1d1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12142a; --surface: #1b1e3a; --ink: #eceefb; --muted: #a3a8c8; --line: #2e3258;
  --accent: #f29a45; --accent-ink: #1b1206; --accent-soft: #3a2a1a;
  --ok: #6fd69c; --ok-bg: #173a29; --bad: #ff958b; --bad-bg: #3f1d1d; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 560px; margin: 0 auto; padding-block: 24px 40px; display: grid; gap: 24px }
.sa { font-family: var(--sa); }
.iast { color: var(--muted); font-size: .9rem; }
h1 { margin: 0; font: 400 3rem/1.1 var(--sa); text-wrap: balance }
h2 { margin: 0; font: 400 1.6rem/1.2 var(--sa) }
.lede { margin: 4px 0 0; color: var(--muted) }
.label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink) }
.btn:disabled { opacity: .4; cursor: default }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line) }

/* home */
.chapter { display: grid; gap: 10px }
.chapter header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.lessons { display: grid; gap: 8px }
.lesson { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px }
.lesson:disabled { opacity: .5; cursor: default }
.dot { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: .9rem;
  border: 2px solid var(--line); color: var(--muted) }
.lesson.next .dot { border-color: var(--accent); color: var(--accent) }
.lesson.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface) }
.lesson .meta { min-width: 0 }
.lesson b { display: block }
.lesson small { color: var(--muted) }

/* intro */
.phrases { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none }
.phrases li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.phrases .txt { min-width: 0; flex: 1 }
.phrases .sa { font-size: 1.35rem; display: block }
.row { display: flex; gap: 10px; flex-wrap: wrap }

/* practice */
.top { display: flex; align-items: center; gap: 12px }
.close { border: 0; background: none; font-size: 1.6rem; line-height: 1; color: var(--muted); padding: 4px 8px }
.progress { flex: 1; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s }
.prompt { display: flex; align-items: center; gap: 14px }
.prompt .big { font-size: 2rem; line-height: 1.3; display: block }
.prompt .en { font-size: 1.35rem; font-weight: 600 }
.choices { display: grid; gap: 10px }
.choice { text-align: left; padding: 14px 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.choice .sa { font-size: 1.3rem; display: block }
.line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding-bottom: 8px }
.bank { display: flex; flex-wrap: wrap; gap: 8px }
.tile { padding: 8px 14px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; display: grid; text-align: center }
.tile .sa { font-size: 1.25rem; line-height: 1.3 }
.tile .iast { font-size: .75rem }
.tile.used { visibility: hidden }
.feedback { border-radius: 14px; padding: 16px; display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line) }
.feedback.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok) }
.feedback.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad) }
.feedback p { margin: 0 }
.feedback .btn { width: 100% }
.done-card { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 24px }
.stat { font-variant-numeric: tabular-nums }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none } }
</style>

<main id="app"></main>

<script src="app.js"></script>
